<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>H-CORE | Dijital Ekipman Merkezi</title><style>
:root{--ink:#123b38;--teal:#086453;--orange:#ef8b25;--bg:#f2f5f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#203734;font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{background:white;border-bottom:4px solid var(--orange);padding:16px max(20px,calc((100% - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}header img{width:205px;max-width:42vw}header strong{color:var(--ink)}main{max-width:1140px;margin:30px auto;padding:0 18px}.hero{background:var(--ink);color:white;padding:26px;border-radius:18px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;opacity:.83}.search{padding:15px;border:1px solid #cbd8d5;border-radius:12px;width:100%;font:inherit;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.tile,.panel{background:white;border-radius:15px;box-shadow:0 3px 14px #10372a10;overflow:hidden}.tile img{width:100%;height:145px;object-fit:contain;background:#f7f8f8;padding:10px}.tile .content{padding:17px}.muted{color:#617570;font-size:13px}.tile h3{margin:8px 0}.pill{display:inline-block;background:#e5f2ee;color:#00624e;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700}.btn{border:0;background:var(--teal);color:white;padding:11px 15px;border-radius:10px;cursor:pointer;font:inherit;font-weight:650}.btn.alt{background:#e8eeec;color:var(--ink)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.detail{display:none}.detail.show{display:block}.back{margin-bottom:15px}.profile{display:grid;grid-template-columns:minmax(200px,330px) 1fr;gap:20px}.profile>img{width:100%;height:260px;object-fit:contain;background:#f7f8f8;border-radius:14px}.panel{padding:20px;margin-bottom:17px}.panel h2{margin:0 0 15px;font-size:19px;color:var(--ink)}.note{background:#f0f6f3;padding:15px;border-radius:10px;line-height:1.6}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e4ebe8;font-size:13px}th{background:#eaf1ef;color:var(--ink)}.card-preview{width:20cm;height:14cm;border:2px solid #07573c;border-radius:18px;background:#fff;color:#123038;font-family:Arial,sans-serif;display:grid;grid-template-columns:48% 52%;overflow:hidden;padding:16px;box-shadow:0 3px 12px #0001}.card-left{display:flex;flex-direction:column;padding:8px 18px 6px 6px;border-right:2px solid #07573c;min-width:0}.card-logo{width:100%;height:66px;object-fit:contain;object-position:left center}.card-photo{width:100%;height:245px;object-fit:contain;margin:auto 0}.card-foot{border-top:1px solid #a4d0ba;padding-top:10px;font-size:11px;color:#07543d}.card-right{display:flex;flex-direction:column;min-width:0;padding:10px 6px 8px 18px}.card-title{font-size:22px;font-weight:900;color:#102d3e;line-height:1.14;margin:0 0 5px;overflow-wrap:anywhere}.card-sub{font-size:13px;color:#526c76;margin-bottom:12px}.card-plate{border:1px solid #a4d0ba;background:#e9f6ed;border-radius:9px;padding:12px;display:flex;justify-content:space-between;gap:7px;align-items:center;font-size:15px;margin:0 0 10px}.card-plate b{color:#07543d;font-size:12px}.card-plate strong{color:#142b3e}.card-desc{font-size:11px;color:#526c76;line-height:1.4;margin-bottom:10px}.card-scan{display:flex;gap:12px;align-items:center;margin:auto 0}.card-scan img{width:180px;height:180px;image-rendering:pixelated;border:1px solid #07573c;border-radius:9px;padding:5px;flex-shrink:0}.scan-copy{font-size:19px;font-weight:900;color:#07543d;line-height:1.25}.card-features{border-top:1px solid #a4d0ba;margin-top:10px;padding-top:8px;font-size:12px;line-height:1.9;color:#173e3a}.print-only{display:none}@media(max-width:650px){.profile{grid-template-columns:1fr}.card-preview{transform:scale(.52);transform-origin:top left;margin-bottom:-6.7cm}.hero h1{font-size:23px}header strong{font-size:12px}}@page{size:21cm 14.8cm;margin:0}@media print{body{background:white}header,main>.hero,.search,.grid,.back,.panel,.actions,.muted,.screen-only{display:none!important}main{margin:0;padding:0;max-width:none}.detail{display:none!important}.print-only{display:block!important}.card-preview{width:20cm!important;height:14cm!important;transform:none!important;margin:.4cm .5cm!important;box-shadow:none;break-after:page}.card-preview:last-child{break-after:auto}} </style></head><body><header><img src="assets/hareket_logo.png" alt="HAREKET"><strong>H-CORE · EKİPMAN MERKEZİ</strong></header><main><section class="hero"><h1>Dijital Ekipman ve Bakım Merkezi</h1><p>Tüm ekipmanlar · Bakım geçmişi · Filtre listesi · Ekipmana özel QR kartları</p></section><div id="home"><input id="search" class="search" placeholder="Makine adı, plaka veya model ara…"><div id="grid" class="grid"></div><div class="actions"><button class="btn alt" onclick="printAll()">Tüm QR kartlarını toplu yazdır</button></div></div><section id="detail" class="detail"></section><div id="printArea" class="print-only"></div></main><script>
let equipment=[];const byId=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(e){const desc=String(e.description||e.name||'');const heading=desc.endsWith(e.plate)?desc.slice(0,-e.plate.length).trim():desc;return `<div class="card-preview"><div class="card-left"><img class="card-logo" src="assets/hareket_logo.png" alt="HAREKET">${e.image?`<img class="card-photo" src="${safe(e.image)}" alt="${safe(e.name)}">`:`<div class="card-photo" style="display:grid;place-items:center;color:#889">Ekipman görseli bulunamadı</div>`}<div class="card-foot">H-CORE &nbsp;|&nbsp; DİJİTAL BAKIM VE KONTROL TAKİBİ</div></div><div class="card-right"><div class="card-title">${safe(e.name)}</div><div class="card-sub">${safe(e.scope)}</div><div class="card-plate"><b>PLAKA / EKİPMAN NO</b><strong>${safe(e.plate)}</strong></div><div class="card-desc">${safe(heading)}</div><div class="card-scan"><img src="${safe(e.qr)}" alt="QR ${safe(e.id)}"><div><div class="scan-copy">← Tara<br>Bakım Paneli</div><div class="card-features">• Bakım kaydı<br>• Filtreler<br>• Araç bilgisi<br>• Periyodik kontrol</div></div></div></div></div>`}
function renderList(){let q=byId('search').value.toLocaleLowerCase('tr');byId('grid').innerHTML=equipment.filter(e=>(e.plate+' '+e.name+' '+e.description).toLocaleLowerCase('tr').includes(q)).map(e=>`<article class="tile"><img src="${e.image}" alt="${safe(e.name)}"><div class="content"><span class="pill">${safe(e.scope)}</span><h3>${safe(e.name)}</h3><div class="muted">${safe(e.plate)} · ${e.filters.length} filtre</div><div class="muted">Son bakım: ${safe(e.maintenanceDate||'Belirtilmedi')}</div><div class="actions"><button class="btn" onclick="show('${e.id}')">Bakım panelini aç</button></div></div></article>`).join('')}
function show(id){let e=equipment.find(x=>x.id===id);if(!e)return;history.replaceState(null,'','?ekipman='+encodeURIComponent(id));byId('home').style.display='none';byId('detail').classList.add('show');byId('detail').innerHTML=`<button class="btn alt back" onclick="home()">← Tüm ekipmanlar</button><div class="panel"><div class="profile"><img src="${e.image}" alt="${safe(e.name)}"><div><span class="pill">${safe(e.scope)}</span><h1>${safe(e.name)}</h1><p><b>Plaka / Ekipman no:</b> ${safe(e.plate)}</p><p><b>Tanım:</b> ${safe(e.description)}</p><p><b>Son bakım:</b> ${safe(e.maintenanceDate||'Belirtilmedi')}</p><div class="actions"><button class="btn" onclick="printOne('${e.id}')">20 × 14 cm yatay A5 QR kartını yazdır</button></div></div></div></div><div class="panel"><h2>Bakım açıklaması</h2><div class="note">${safe(e.maintenanceNote||'Bakım bilgisi bulunamadı.')}</div></div><div class="panel"><h2>Filtre listesi (${e.filters.length})</h2><div class="tablewrap"><table><thead><tr><th>Malzeme kodu</th><th>Filtre açıklaması</th><th>Adet</th><th>Lot / alternatif kodlar</th></tr></thead><tbody>${e.filters.map(f=>`<tr><td>${safe(f.code)}</td><td>${safe(f.name)}</td><td>${safe(f.quantity)}</td><td>${safe([f.alternative,f.lot1,f.lot2,f.lot3].filter(Boolean).join(' / '))}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>QR kartı önizlemesi</h2>${card(e)}</div>`;window.scrollTo(0,0)}
function home(){history.replaceState(null,'',location.pathname);byId('home').style.display='block';byId('detail').classList.remove('show');window.scrollTo(0,0)}function printOne(id){byId('printArea').innerHTML=card(equipment.find(x=>x.id===id));window.print()}function printAll(){byId('printArea').innerHTML=equipment.map(card).join('');window.print()}
fetch('data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{equipment=data.equipment;renderList();const id=new URLSearchParams(location.search).get('ekipman');if(id)show(id);byId('search').addEventListener('input',renderList)}).catch(err=>{byId('grid').innerHTML='<p>Veri dosyası açılamadı. Uygulamayı GitHub Pages üzerinden açın; bilgisayarda doğrudan HTML dosyasını açmak yeterli değildir.</p>';console.error(err)});
</script></body></html>
